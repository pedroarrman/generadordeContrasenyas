<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>⚙ Genera tu contraseña segura ⚙</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            background-color: #3E4452;
            color: white;
            font-family: Arial, Helvetica, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
        }

        #container {
            width: 100%;
            max-width: 700px;

            text-align: center;

            padding: 30px 20px;
        }

        h3 {
            font-size: clamp(1.5rem, 5vw, 2.5rem);
            margin: 0 0 35px;
            text-align: center;
        }

        /* Botones */
        button {
            width: 100%;
            max-width: 600px;

            font-size: clamp(1rem, 3vw, 1.4rem);
            font-weight: 600;

            background-color: #686ffd;
            border: none;
            padding: 15px 25px;

            border-radius: 25px;

            color: white;

            box-shadow:
                0 1px 1px rgba(0, 0, 0, 0.12),
                0 2px 2px rgba(0, 0, 0, 0.12),
                0 4px 4px rgba(0, 0, 0, 0.12),
                0 8px 8px rgba(0, 0, 0, 0.12),
                0 16px 16px rgba(0, 0, 0, 0.12);

            cursor: pointer;

            transition: all 0.3s ease;
        }

        button:hover {
            opacity: 0.8;
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        /* Contraseña generada */
        #textoACopiar {
            width: 100%;
            max-width: 600px;

            margin: 35px auto;

            padding: 20px;

            background-color: rgba(0, 0, 0, 0.15);

            border-radius: 15px;

            overflow-x: auto;
        }

        #geeks {
            margin: 0;

            font-size: clamp(1.2rem, 5vw, 2rem);

            color: #B1B2CF;

            word-break: break-all;

            min-height: 40px;
        }

        #geeks:hover {
            color: #686ffd;
            transition: all 0.4s;
        }

        /* Separación entre botones */
        .espacio {
            height: 20px;
        }

        /* Mensaje */
        #alerta {
            margin-top: 15px;
            font-size: 0.95rem;
        }

        /* Tablet */
        @media (min-width: 600px) {
            #container {
                padding: 40px;
            }

            button {
                padding: 17px 30px;
            }
        }

        /* Móvil */
        @media (max-width: 480px) {
            body {
                padding: 15px;
            }

            #container {
                padding: 20px 10px;
            }

            button {
                font-size: 1rem;
                padding: 14px 18px;
                border-radius: 20px;
            }

            #textoACopiar {
                padding: 15px;
                margin: 25px auto;
            }

            #geeks {
                font-size: 1.2rem;
            }
        }
    </style>
</head>

<body>

    <main id="container">

        <!-- Generar contraseña -->
        <button id="par1" onclick="gfg_Run()">
            Pincha aquí para crear tu contraseña segura
        </button>

        <!-- Contraseña -->
        <div id="textoACopiar">
            <p id="geeks"></p>
        </div>

        <!-- Copiar -->
        <button id="btnCopiar">
            COPIAR a portapapeles
        </button>

        <div id="alerta"></div>

        <div class="espacio"></div>

        <!-- Descargar -->
        <button id="descargar">
            Descargar TXT
        </button>

    </main>


    <script>
        /* =========================
           GENERAR CONTRASEÑA
        ========================= */

        const el_down = document.getElementById("geeks");

        function generateP() {

            let pass = '';

            const str =
                'abcdefghijklmnñopqrstuvwxyz' +
                'ABCDEFGHIJKLMNÑOPQRSTUVWXYZ' +
                '0123456789,;:!?.';

            for (let i = 0; i < 10; i++) {

                const char = Math.floor(
                    Math.random() * str.length
                );

                pass += str.charAt(char);
            }

            return pass;
        }


        function gfg_Run() {

            document.getElementById("par1").innerHTML =
                "Generar otra contraseña";

            el_down.innerHTML = generateP();
        }


        /* =========================
           COPIAR AL PORTAPAPELES
        ========================= */

        document
            .getElementById("btnCopiar")
            .addEventListener("click", copiarAlPortapapeles);


        async function copiarAlPortapapeles() {

            const contraseña =
                document.getElementById("geeks").textContent.trim();

            if (!contraseña) {
                alert("Primero genera una contraseña.");
                return;
            }

            try {

                await navigator.clipboard.writeText(contraseña);

                alert("Contraseña copiada con éxito");

            } catch (error) {

                /* Método alternativo para navegadores antiguos */

                const seleccion = document.createRange();

                const elemento =
                    document.getElementById("textoACopiar");

                seleccion.selectNodeContents(elemento);

                window.getSelection().removeAllRanges();

                window.getSelection().addRange(seleccion);

                try {

                    document.execCommand("copy");

                    alert("Contraseña copiada con éxito");

                } catch (error) {

                    alert("No se pudo copiar la contraseña.");

                }

                window.getSelection().removeAllRanges();
            }
        }


        /* =========================
           DESCARGAR TXT
        ========================= */

        document
            .getElementById("descargar")
            .addEventListener("click", function () {

                const texto =
                    document.getElementById("geeks").textContent.trim();

                if (!texto) {

                    alert("Primero genera una contraseña.");

                    return;
                }

                const blob =
                    new Blob(
                        [texto],
                        { type: "text/plain;charset=utf-8" }
                    );

                const url =
                    URL.createObjectURL(blob);

                const enlace =
                    document.createElement("a");

                enlace.href = url;
                enlace.download = "tu_contraseña.txt";

                document.body.appendChild(enlace);

                enlace.click();

                document.body.removeChild(enlace);

                URL.revokeObjectURL(url);
            });
    </script>

</body>

</html>
